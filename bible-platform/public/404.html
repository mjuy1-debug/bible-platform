<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>여호수아 성경앱</title>
    <script>
      // GitHub Pages SPA 새로고침 404 해결 스크립트
      // 현재 URL 경로를 쿼리 파라미터로 인코딩하여 루트로 리다이렉트
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) + '&qs=1' +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
